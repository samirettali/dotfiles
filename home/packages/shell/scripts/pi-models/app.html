<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pi-models</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1a1d23;
    --panel-2: #20242c;
    --line: #2b303a;
    --text: #dfe3ea;
    --dim: #8b93a3;
    --faint: #5b6373;
    --accent: #7aa2f7;
    --good: #9ece6a;
    --warn: #e0af68;
    --bad: #f7768e;
    --radius: 8px;
    --motion: 120ms ease;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
    display: grid;
    grid-template-rows: auto 1fr;
    font-variant-numeric: tabular-nums;
  }

  .num { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }

  /* ---------- top bar ---------- */

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }

  header h1 {
    font-size: 13px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }

  header .path {
    color: var(--faint);
    font-family: ui-monospace, Menlo, monospace;
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }

  .badge {
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    border: 1px solid var(--line);
    color: var(--dim);
  }

  .badge.dirty { color: var(--warn); border-color: var(--warn); }

  .msg {
    color: var(--dim);
    font-size: 12px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity var(--motion);
  }

  .msg.show { opacity: 1; }

  button {
    font: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 5px 11px;
    cursor: pointer;
    transition: background var(--motion), border-color var(--motion), color var(--motion);
  }

  button:hover:not(:disabled) { background: #272c36; border-color: #39404e; }
  button:disabled { opacity: 0.4; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  button.primary { background: var(--accent); border-color: var(--accent); color: #10131a; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #8fb3f9; border-color: #8fb3f9; }

  /* ---------- layout ---------- */

  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
    min-height: 0;
  }

  .col { min-width: 0; min-height: 0; overflow-y: auto; }
  .col + .col { border-left: 1px solid var(--line); }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .col + .col { border-left: none; border-top: 1px solid var(--line); }
  }

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 10px 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }

  input[type="search"], input[type="number"] {
    font: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 5px 9px;
  }

  input[type="search"] { flex: 1; }
  input[type="number"] { width: 130px; font-family: ui-monospace, Menlo, monospace; }

  .chips { display: flex; gap: 4px; }

  .chip {
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    border: 1px solid var(--line);
    background: transparent;
  }

  .chip[aria-pressed="true"] {
    background: var(--panel-2);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ---------- vendor groups ---------- */

  .group { border-bottom: 1px solid var(--line); }

  .group > summary {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    cursor: pointer;
    list-style: none;
    user-select: none;
    transition: background var(--motion);
  }

  .group > summary::-webkit-details-marker { display: none; }
  .group > summary:hover { background: var(--panel); }

  .group .caret {
    color: var(--faint);
    transition: transform var(--motion);
    display: inline-block;
    width: 10px;
  }

  .group[open] .caret { transform: rotate(90deg); }

  .vendor { font-weight: 600; letter-spacing: 0.02em; }
  .count { color: var(--faint); font-size: 11px; }
  .group summary .spacer { flex: 1; }

  .row {
    display: grid;
    grid-template-columns: 22px 1fr 92px 74px 60px 66px;
    align-items: center;
    gap: 8px;
    padding: 6px 12px 6px 26px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background var(--motion), border-color var(--motion);
  }

  .row:hover { background: var(--panel); }
  .row[aria-selected="true"] { background: var(--panel-2); border-left-color: var(--accent); }

  .row .slug { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .pin, .row .ctx, .row .age { color: var(--dim); font-size: 11px; text-align: right; }
  .row .pin { text-align: left; color: var(--good); }
  .row .age.fresh { color: var(--accent); }
  .row.off .slug { color: var(--dim); }

  .mark {
    width: 16px;
    height: 16px;
    border-radius: 4px;
    border: 1px solid var(--line);
    display: grid;
    place-items: center;
    font-size: 11px;
    color: #10131a;
    transition: background var(--motion), border-color var(--motion);
  }

  .mark.on { background: var(--good); border-color: var(--good); }

  .where {
    font-size: 10px;
    text-align: right;
    color: var(--faint);
  }
  .where.replaces { color: var(--warn); }

  /* ---------- detail ---------- */

  .detail { padding: 16px; display: grid; gap: 16px; align-content: start; }
  .detail h2 { font-size: 15px; margin: 0; font-family: ui-monospace, Menlo, monospace; }
  .detail .sub { color: var(--dim); font-size: 12px; margin-top: 2px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
    display: grid;
    gap: 10px;
  }

  .card h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--faint);
    margin: 0;
    font-weight: 600;
  }

  .field { display: flex; align-items: center; gap: 8px; min-height: 28px; }
  .field > label:first-child { color: var(--dim); width: 118px; flex: none; }
  .hint { color: var(--faint); font-size: 11px; }
  .hint.warn { color: var(--warn); }

  table { border-collapse: collapse; width: 100%; font-size: 12px; }

  th {
    text-align: right;
    color: var(--faint);
    font-weight: 600;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0 8px 6px;
    border-bottom: 1px solid var(--line);
  }

  th[data-sort] {
    cursor: pointer;
    user-select: none;
    transition: color var(--motion);
  }

  th[data-sort]:hover { color: var(--dim); }
  th[aria-sort]:not([aria-sort="none"]) { color: var(--accent); }

  /* Reserved so the header never shifts when the indicator appears. */
  th[data-sort] .caret-sort {
    display: inline-block;
    width: 9px;
    margin-left: 3px;
    text-align: center;
    opacity: 0;
    transition: opacity var(--motion);
  }

  th[aria-sort="ascending"] .caret-sort,
  th[aria-sort="descending"] .caret-sort { opacity: 1; }

  th:first-child, td:first-child { text-align: left; }
  th.l, td.l { text-align: left; }

  td { padding: 5px 8px; text-align: right; border-bottom: 1px solid #232830; }
  tbody tr { cursor: pointer; transition: background var(--motion); }
  tbody tr:hover { background: var(--panel-2); }
  tbody tr[aria-selected="true"] { background: #232a38; }
  tbody tr[aria-selected="true"] td:first-child { box-shadow: inset 2px 0 var(--accent); }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .empty { color: var(--faint); padding: 40px 16px; text-align: center; }
  .err { color: var(--bad); }
  .switch {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--dim);
    white-space: nowrap;
    cursor: pointer;
  }

  .switch input { accent-color: var(--accent); margin: 0; }
</style>
</head>
<body>

<header>
  <h1>pi-models</h1>
  <span class="path" id="path"></span>
  <span class="msg" id="msg" role="status" aria-live="polite"></span>
  <span class="badge" id="status">loading</span>
  <button class="primary" id="save" disabled>Save</button>
</header>

<main>
  <section class="col">
    <div class="toolbar">
      <input type="search" id="search" placeholder="Filter models, vendors, providers…" autocomplete="off">
      <div class="chips" id="filters">
        <button class="chip" data-filter="enabled" aria-pressed="true">Enabled</button>
        <button class="chip" data-filter="configured" aria-pressed="false">Configured</button>
        <button class="chip" data-filter="all" aria-pressed="false">All</button>
        <button class="chip" data-filter="new" aria-pressed="false" title="Whole catalog, newest first">New</button>
      </div>
    </div>
    <div id="list"></div>
  </section>

  <section class="col">
    <div class="detail" id="detail"><div class="empty">Select a model.</div></div>
  </section>
</main>

<script type="module">
const $ = (id) => document.getElementById(id);

const state = {
  path: "",
  config: null,
  builtins: [],
  catalog: [],
  endpoints: new Map(),
  dirty: false,
  filter: "enabled",
  query: "",
  selected: null,
  copyLimits: true,
  open: new Set(),
  sort: { key: null, dir: 1 },
};

const fmtTokens = (v) =>
  typeof v !== "number" ? "—" : v >= 1e6 ? `${(v / 1e6).toFixed(1)}M` : v >= 1000 ? `${Math.round(v / 1000)}k` : String(v);

const fmtPrice = (p, k) => {
  const n = Number(p?.[k]);
  return Number.isFinite(n) ? (n * 1e6).toFixed(2) : "—";
};

const DAY = 86400;
const FRESH_DAYS = 21;

const ageInDays = (created) =>
  typeof created === "number" ? (Date.now() / 1000 - created) / DAY : null;

function fmtAge(created) {
  const days = ageInDays(created);
  if (days === null) return "";
  if (days < 1) return "today";
  if (days < 30) return `${Math.round(days)}d`;
  const d = new Date(created * 1000);
  const month = d.toLocaleString("en", { month: "short" });
  return `${month} '${String(d.getFullYear()).slice(2)}`;
}

const splitRef = (ref) => {
  const i = ref.indexOf("/");
  return { provider: ref.slice(0, i), modelId: ref.slice(i + 1) };
};

// ---------- what pi already knows ----------

const isBuiltin = (provider) => provider in state.builtins;

/** The metadata pi merges under an override, or null when pi has never heard of the model. */
const builtinFor = (provider, modelId) => state.builtins[provider]?.[modelId] ?? null;

/**
 * An override that only restates the built-in value is worse than no override: it is dead
 * weight today and stale the moment pi.dev refreshes its catalog. Store nothing in that case.
 */
function setInherited(entry, field, value, builtin) {
  if (value === null || value === undefined || (builtin && builtin[field] === value)) {
    delete entry[field];
    return false;
  }
  entry[field] = value;
  return true;
}

// ---------- config access ----------

function entryFor(provider, modelId) {
  const block = state.config.providers[provider];
  if (!block) return { entry: null, location: null };
  const listed = (block.models ?? []).find((m) => m.id === modelId);
  if (listed) return { entry: listed, location: "models" };
  const override = block.modelOverrides?.[modelId];
  return override ? { entry: override, location: "modelOverrides" } : { entry: null, location: null };
}

function ensureEntry(provider, modelId) {
  const found = entryFor(provider, modelId);
  if (found.entry) return found.entry;

  const block = (state.config.providers[provider] ??= {});
  markDirty();

  if (isBuiltin(provider)) {
    block.modelOverrides ??= {};
    return (block.modelOverrides[modelId] ??= {});
  }
  if (provider === "openrouter") {
    block.baseUrl ??= "https://openrouter.ai/api/v1";
    block.api ??= "openai-completions";
  }
  block.models ??= [];
  const created = { id: modelId };
  block.models.push(created);
  return created;
}

function pruneEntry(provider, modelId) {
  const { entry, location } = entryFor(provider, modelId);
  if (!entry) return;
  const meaningful = Object.keys(entry).filter((k) => k !== "id");
  if (meaningful.length) return;
  dropEntry(provider, modelId);
}

function dropEntry(provider, modelId) {
  const block = state.config.providers[provider];
  if (!block) return;
  if (block.models) {
    const i = block.models.findIndex((m) => m.id === modelId);
    if (i !== -1) block.models.splice(i, 1);
    if (!block.models.length) delete block.models;
  }
  if (block.modelOverrides && modelId in block.modelOverrides) {
    delete block.modelOverrides[modelId];
    if (!Object.keys(block.modelOverrides).length) delete block.modelOverrides;
  }
  if (!Object.keys(block).length) delete state.config.providers[provider];
  markDirty();
}

function routingOf(entry) {
  return entry?.compat?.openRouterRouting ?? {};
}

function pinOf(entry) {
  const only = routingOf(entry).only;
  return only?.length ? String(only[0]).split("/")[0] : null;
}

function quantOf(entry) {
  const routing = routingOf(entry);
  const only = routing.only;
  if (only?.length && String(only[0]).includes("/")) return String(only[0]).split("/")[1];
  return routing.quantizations?.join("/") ?? null;
}

// ---------- rows ----------

function buildRows() {
  const seen = new Set();
  const rows = [];

  for (const ref of state.config.enabledModels) {
    const { provider, modelId } = splitRef(ref);
    rows.push({ ref, provider, modelId, enabled: true, ...entryFor(provider, modelId) });
    seen.add(ref);
  }

  for (const [provider, block] of Object.entries(state.config.providers)) {
    const configured = [
      ...(block.models ?? []).map((m) => [m.id, m, "models"]),
      ...Object.entries(block.modelOverrides ?? {}).map(([id, e]) => [id, e, "modelOverrides"]),
    ];
    for (const [modelId, entry, location] of configured) {
      const ref = `${provider}/${modelId}`;
      if (seen.has(ref)) continue;
      rows.push({ ref, provider, modelId, enabled: false, entry, location });
      seen.add(ref);
    }
  }

  if (state.filter === "all" || state.filter === "new") {
    for (const model of state.catalog) {
      const ref = `openrouter/${model.id}`;
      if (seen.has(ref)) continue;
      rows.push({ ref, provider: "openrouter", modelId: model.id, enabled: false, entry: null, location: null });
      seen.add(ref);
    }
  }

  return rows;
}

function vendorOf(row) {
  return row.provider === "openrouter" ? row.modelId.split("/")[0] : row.provider;
}

function visibleRows() {
  const q = state.query.trim().toLowerCase();
  return buildRows().filter((row) => {
    if (state.filter === "enabled" && !row.enabled) return false;
    if (state.filter === "configured" && !row.entry) return false;
    if (state.filter === "new" && row.provider !== "openrouter") return false;
    if (!q) return true;
    const meta = state.catalog.find((m) => m.id === row.modelId);
    return [row.ref, vendorOf(row), pinOf(row.entry) ?? "", meta?.name ?? ""]
      .join(" ").toLowerCase().includes(q);
  });
}

// ---------- render: list ----------

function renderList() {
  const rows = visibleRows();
  const list = $("list");

  if (state.filter === "new") {
    list.textContent = "";
    const createdOf = (row) => state.catalog.find((m) => m.id === row.modelId)?.created ?? 0;
    const recent = rows.slice().sort((a, b) => createdOf(b) - createdOf(a));
    if (!recent.length) {
      list.innerHTML = `<div class="empty">Nothing matches.</div>`;
      return;
    }
    const flat = document.createElement("div");
    flat.className = "group";
    for (const row of recent) flat.append(renderRow(row));
    list.append(flat);
    return;
  }

  const groups = new Map();
  for (const row of rows) {
    const vendor = vendorOf(row);
    if (!groups.has(vendor)) groups.set(vendor, []);
    groups.get(vendor).push(row);
  }

  list.textContent = "";

  if (!groups.size) {
    list.innerHTML = `<div class="empty">Nothing matches.</div>`;
    return;
  }

  const sorted = [...groups.entries()].sort((a, b) => {
    const enabled = (g) => g[1].filter((r) => r.enabled).length;
    return enabled(b) - enabled(a) || a[0].localeCompare(b[0]);
  });

  for (const [vendor, items] of sorted) {
    const details = document.createElement("details");
    details.className = "group";
    details.open = state.open.has(vendor) || state.filter !== "all";
    details.addEventListener("toggle", () => {
      details.open ? state.open.add(vendor) : state.open.delete(vendor);
    });

    const on = items.filter((r) => r.enabled).length;
    const summary = document.createElement("summary");
    summary.innerHTML = `
      <span class="caret">▶</span>
      <span class="vendor">${escape(vendor)}</span>
      <span class="spacer"></span>
      <span class="count">${on}/${items.length}</span>`;
    details.append(summary);

    for (const row of items) details.append(renderRow(row));
    list.append(details);
  }
}

function renderRow(row) {
  const el = document.createElement("div");
  el.className = `row${row.enabled ? "" : " off"}`;
  el.setAttribute("aria-selected", String(state.selected === row.ref));

  // Vendor groups carry the vendor name, so the row drops it; the flat view needs it back.
  const label =
    row.provider === "openrouter" && state.filter !== "new"
      ? row.modelId.split("/").slice(1).join("/")
      : row.modelId;
  const meta = state.catalog.find((m) => m.id === row.modelId);
  const ctx = row.entry?.contextWindow ?? meta?.contextLength;
  const where = { models: "replaces", modelOverrides: "override" }[row.location] ?? "";
  const days = ageInDays(meta?.created);
  const listed = meta?.created ? new Date(meta.created * 1000).toISOString().slice(0, 10) : null;

  el.innerHTML = `
    <span class="mark${row.enabled ? " on" : ""}">${row.enabled ? "✓" : ""}</span>
    <span class="slug">${escape(label)}</span>
    <span class="pin">${escape(pinOf(row.entry) ?? "")}${quantOf(row.entry) ? ` <span style="color:var(--faint)">${escape(quantOf(row.entry))}</span>` : ""}</span>
    <span class="ctx num">${fmtTokens(ctx)}</span>
    <span class="age num${days !== null && days <= FRESH_DAYS ? " fresh" : ""}"
          ${listed ? `title="listed on OpenRouter ${listed}"` : ""}>${fmtAge(meta?.created)}</span>
    <span class="where ${where}">${where}</span>`;

  el.querySelector(".mark").addEventListener("click", (ev) => {
    ev.stopPropagation();
    toggleEnabled(row.ref);
  });
  el.addEventListener("click", () => select(row.ref));
  return el;
}

// ---------- render: detail ----------

/**
 * The hint names what pi inherits, which is its own catalog value — not OpenRouter's.
 * The two disagree often enough that showing the wrong one is how redundant overrides get written.
 */
function limitField(field, entry, builtin, openrouterValue) {
  const stored = entry?.[field];
  const inherited = builtin?.[field] ?? null;
  const redundant = stored !== undefined && inherited !== null && stored === inherited;

  const hints = [];
  if (inherited !== null) hints.push(`pi inherits ${fmtTokens(inherited)}`);
  else if (builtin) hints.push("pi has no value — must be set here");
  else hints.push("unknown to pi — override would be ignored");
  if (typeof openrouterValue === "number" && openrouterValue !== inherited) {
    hints.push(`OpenRouter says ${fmtTokens(openrouterValue)}`);
  }

  return `
    <div class="field">
      <label>${field}</label>
      <input type="number" data-field="${field}" value="${stored ?? ""}"
             placeholder="${inherited ?? "inherit"}">
      <span class="hint${redundant ? " warn" : ""}">${escape(hints.join(" · "))}</span>
      ${redundant ? `<button data-drop-field="${field}" title="Stored value equals what pi inherits">Redundant — remove</button>` : ""}
    </div>`;
}

async function renderDetail() {
  const detail = $("detail");
  if (!state.selected) {
    detail.innerHTML = `<div class="empty">Select a model.</div>`;
    return;
  }

  const { provider, modelId } = splitRef(state.selected);
  const { entry, location } = entryFor(provider, modelId);
  const enabled = state.config.enabledModels.includes(state.selected);
  const meta = state.catalog.find((m) => m.id === modelId);
  const isOpenRouter = provider === "openrouter";
  const builtin = builtinFor(provider, modelId);
  const where = { models: "replaces built-in", modelOverrides: "merges over built-in" }[location] ?? "no override";

  detail.textContent = "";
  const listed = meta?.created
    ? ` · listed on OpenRouter ${new Date(meta.created * 1000).toISOString().slice(0, 10)} (${fmtAge(meta.created)})`
    : "";

  detail.append(el(`
    <div>
      <h2>${escape(state.selected)}</h2>
      <div class="sub">${escape(meta?.name ?? "not in the OpenRouter catalog")}${escape(listed)}</div>
    </div>`));

  // config card
  const config = el(`
    <div class="card">
      <h3>Configuration</h3>
      <div class="field">
        <label>Enabled</label>
        <button data-act="toggle">${enabled ? "Disable" : "Enable"}</button>
        <span class="hint">${enabled ? "listed in enabledModels" : "not offered in /model"}</span>
      </div>
      <div class="field">
        <label>Stored as</label>
        <span class="hint ${location === "models" ? "err" : ""}">${escape(where)}</span>
        ${location === "models" && isBuiltin(provider)
          ? `<button data-act="migrate">Convert to modelOverrides</button>` : ""}
      </div>
      ${limitField("contextWindow", entry, builtin, meta?.contextLength)}
      ${limitField("maxTokens", entry, builtin, meta?.maxCompletionTokens)}
      ${isOpenRouter ? `
      <div class="field">
        <label>Routing</label>
        <label class="switch"><input type="checkbox" data-flag="allow_fallbacks"
          ${routingOf(entry).allow_fallbacks ? "checked" : ""}> allow_fallbacks</label>
        <label class="switch"><input type="checkbox" data-flag="data_collection"
          ${routingOf(entry).data_collection === "deny" ? "checked" : ""}> data_collection: deny</label>
      </div>` : ""}
      <div class="actions">
        ${entry ? `<button data-act="drop">Remove all overrides</button>` : ""}
      </div>
    </div>`);

  config.querySelector('[data-act="toggle"]').onclick = () => toggleEnabled(state.selected);
  config.querySelector('[data-act="migrate"]')?.addEventListener("click", () => migrate(provider, modelId));
  config.querySelector('[data-act="drop"]')?.addEventListener("click", () => {
    dropEntry(provider, modelId);
    render();
  });

  for (const input of config.querySelectorAll("[data-field]")) {
    input.onchange = () => setLimit(provider, modelId, input.dataset.field, input.value);
  }
  for (const btn of config.querySelectorAll("[data-drop-field]")) {
    btn.onclick = () => setLimit(provider, modelId, btn.dataset.dropField, "");
  }
  for (const box of config.querySelectorAll("[data-flag]")) {
    box.onchange = () => setRoutingFlag(provider, modelId, box.dataset.flag, box.checked);
  }
  detail.append(config);

  if (!isOpenRouter) {
    detail.append(el(`<div class="card"><h3>Providers</h3>
      <span class="hint">Provider routing only applies to OpenRouter models.</span></div>`));
    return;
  }

  detail.append(await renderProviders(provider, modelId, entry));
}

// `first` is the direction the first click applies: cheapest price, but biggest
// context and best uptime, which is what you actually look for in each column.
const SORT_COLUMNS = [
  { key: "provider", label: "Provider", align: "l", first: 1, value: (e) => e.provider },
  { key: "quant", label: "Quant", align: "l", first: 1, value: (e) => e.quantization },
  { key: "context", label: "Context", align: "", first: -1, value: (e) => e.contextLength },
  { key: "max", label: "Max tok", align: "", first: -1, value: (e) => e.maxCompletionTokens },
  { key: "in", label: "$ in/M", align: "", first: 1, value: (e) => num(e.pricing?.prompt) },
  { key: "out", label: "$ out/M", align: "", first: 1, value: (e) => num(e.pricing?.completion) },
  { key: "uptime", label: "Uptime", align: "", first: -1, value: (e) => e.uptime },
];

function num(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

function cycleSort(key) {
  const column = SORT_COLUMNS.find((c) => c.key === key);
  if (state.sort.key !== key) state.sort = { key, dir: column.first };
  else if (state.sort.dir === column.first) state.sort = { key, dir: -column.first };
  else state.sort = { key: null, dir: 1 };
}

function sortEndpoints(endpoints) {
  const column = SORT_COLUMNS.find((c) => c.key === state.sort.key);
  if (!column) return endpoints;

  // Decorate with the original index so equal values keep OpenRouter's order,
  // and keep missing values at the bottom in both directions.
  return endpoints
    .map((ep, i) => ({ ep, i, v: column.value(ep) }))
    .sort((a, b) => {
      const missing = (x) => x.v === null || x.v === undefined || x.v === "";
      if (missing(a) !== missing(b)) return missing(a) ? 1 : -1;
      if (missing(a)) return a.i - b.i;
      const cmp = typeof a.v === "string" ? a.v.localeCompare(b.v) : a.v - b.v;
      return cmp * state.sort.dir || a.i - b.i;
    })
    .map((d) => d.ep);
}

async function renderProviders(provider, modelId, entry) {
  const card = el(`
    <div class="card">
      <h3>Providers</h3>
      <label class="switch"><input type="checkbox" id="copylimits" ${state.copyLimits ? "checked" : ""}>
        copy context / max tokens from the chosen provider</label>
      <div id="eptable"><span class="hint">Loading endpoints…</span></div>
    </div>`);

  card.querySelector("#copylimits").onchange = (ev) => { state.copyLimits = ev.target.checked; };

  let endpoints;
  try {
    endpoints = await loadEndpoints(modelId);
  } catch (err) {
    card.querySelector("#eptable").innerHTML = `<span class="hint err">${escape(String(err.message))}</span>`;
    return card;
  }

  if (!endpoints.length) {
    card.querySelector("#eptable").innerHTML = `<span class="hint">No endpoints reported.</span>`;
    return card;
  }

  const pin = pinOf(entry);
  const quant = quantOf(entry);
  const table = el(`
    <table>
      <thead><tr>
        ${SORT_COLUMNS.map((c) => `
          <th class="${c.align}" data-sort="${c.key}" aria-sort="none"
              title="Sort by ${c.label.toLowerCase()}">${c.label}<span class="caret-sort"></span></th>`).join("")}
      </tr></thead>
      <tbody></tbody>
    </table>`);

  const tbody = table.querySelector("tbody");

  const paint = () => {
    tbody.textContent = "";
    for (const ep of sortEndpoints(endpoints)) {
      const selected = pin === ep.provider && (quant === null || quant === undefined || quant === ep.quantization);
      const tr = el(`
        <tr aria-selected="${selected}" title="click: pin ${escape(ep.tag)} — shift-click: pin ${escape(ep.provider)} (any quant)">
          <td class="l">${escape(ep.provider)}</td>
          <td class="l" style="color:var(--dim)">${escape(ep.quantization ?? "—")}</td>
          <td class="num">${fmtTokens(ep.contextLength)}</td>
          <td class="num">${fmtTokens(ep.maxCompletionTokens)}</td>
          <td class="num">${fmtPrice(ep.pricing, "prompt")}</td>
          <td class="num">${fmtPrice(ep.pricing, "completion")}</td>
          <td class="num">${typeof ep.uptime === "number" ? `${ep.uptime.toFixed(1)}%` : "—"}</td>
        </tr>`);
      tr.onclick = (ev) => applyEndpoint(provider, modelId, ep, !ev.shiftKey);
      tbody.append(tr);
    }

    for (const th of table.querySelectorAll("th[data-sort]")) {
      const active = state.sort.key === th.dataset.sort;
      th.setAttribute("aria-sort", active ? (state.sort.dir === 1 ? "ascending" : "descending") : "none");
      th.querySelector(".caret-sort").textContent = active ? (state.sort.dir === 1 ? "▲" : "▼") : "";
    }
  };

  for (const th of table.querySelectorAll("th[data-sort]")) {
    th.onclick = () => {
      cycleSort(th.dataset.sort);
      paint();
    };
  }

  paint();

  const footer = el(`<div class="actions">
      <button data-act="unpin">Clear provider pin</button>
      <span class="hint">click a row to pin provider + quant · shift-click for the provider only
        · click a header to sort, again to reverse, a third time for OpenRouter's own order</span>
    </div>`);
  footer.querySelector('[data-act="unpin"]').onclick = () => clearPin(provider, modelId);

  card.querySelector("#eptable").replaceWith(table);
  card.append(footer);
  return card;
}

// ---------- mutations ----------

let flashTimer;

function flash(text) {
  const msg = $("msg");
  msg.textContent = text;
  msg.classList.add("show");
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => msg.classList.remove("show"), 6000);
}

function markDirty() {
  state.dirty = true;
  $("status").textContent = "unsaved";
  $("status").classList.add("dirty");
  $("save").disabled = false;
}

function toggleEnabled(ref) {
  const list = state.config.enabledModels;
  const i = list.indexOf(ref);
  i === -1 ? list.push(ref) : list.splice(i, 1);
  markDirty();
  render();
}

function setLimit(provider, modelId, field, raw) {
  const value = raw.trim();
  if (!value) {
    const { entry } = entryFor(provider, modelId);
    if (entry) delete entry[field];
    pruneEntry(provider, modelId);
  } else {
    const n = Number(value);
    if (!Number.isInteger(n) || n <= 0) return render();
    const builtin = builtinFor(provider, modelId);
    if (builtin && builtin[field] === n) {
      const { entry } = entryFor(provider, modelId);
      if (entry) delete entry[field];
      pruneEntry(provider, modelId);
      flash(`${field} ${fmtTokens(n)} is what pi already uses — left inherited instead of stored`);
    } else {
      ensureEntry(provider, modelId)[field] = n;
    }
  }
  markDirty();
  render();
}

function setRoutingFlag(provider, modelId, flag, on) {
  const entry = ensureEntry(provider, modelId);
  const routing = ((entry.compat ??= {}).openRouterRouting ??= {});
  if (flag === "data_collection") {
    on ? (routing.data_collection = "deny") : delete routing.data_collection;
  } else {
    routing.allow_fallbacks = on;
  }
  markDirty();
  render();
}

function applyEndpoint(provider, modelId, ep, withQuant) {
  const entry = ensureEntry(provider, modelId);
  const routing = ((entry.compat ??= {}).openRouterRouting ??= {});
  routing.allow_fallbacks ??= false;
  routing.only = [withQuant && ep.quantization ? ep.tag : ep.provider];

  let wrote = 0;
  if (state.copyLimits) {
    const builtin = builtinFor(provider, modelId);
    wrote += setInherited(entry, "contextWindow", ep.contextLength ?? null, builtin);
    wrote += setInherited(entry, "maxTokens", ep.maxCompletionTokens ?? null, builtin);
  }
  markDirty();
  render();

  const target = routing.only[0];
  flash(
    state.copyLimits && !wrote
      ? `Pinned ${target} — limits left inherited, this provider matches what pi already uses`
      : `Pinned ${target}${wrote ? " and copied the limits that differ from pi's catalog" : ""}`,
  );
}

function clearPin(provider, modelId) {
  const { entry } = entryFor(provider, modelId);
  if (!entry) return;
  const routing = routingOf(entry);
  delete routing.only;
  if (!Object.keys(routing).length) delete entry.compat.openRouterRouting;
  if (entry.compat && !Object.keys(entry.compat).length) delete entry.compat;
  pruneEntry(provider, modelId);
  markDirty();
  render();
}

function migrate(provider, modelId) {
  const block = state.config.providers[provider];
  const i = block.models?.findIndex((m) => m.id === modelId) ?? -1;
  if (i === -1) return;
  const [entry] = block.models.splice(i, 1);
  delete entry.id;
  if (!block.models.length) delete block.models;
  (block.modelOverrides ??= {})[modelId] = entry;
  markDirty();
  render();
}

// ---------- io ----------

async function loadEndpoints(modelId) {
  if (state.endpoints.has(modelId)) return state.endpoints.get(modelId);
  const res = await fetch(`/api/endpoints?id=${encodeURIComponent(modelId)}`);
  const body = await res.json();
  if (!res.ok) throw new Error(body.error ?? res.statusText);
  state.endpoints.set(modelId, body);
  return body;
}

async function save() {
  $("save").disabled = true;
  const res = await fetch("/api/config", {
    method: "PUT",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(state.config),
  });
  const body = await res.json();
  if (!res.ok) {
    $("status").textContent = body.error ?? "write failed";
    $("save").disabled = false;
    return;
  }
  state.dirty = false;
  $("status").classList.remove("dirty");
  $("status").textContent = "saved — run `make build`";
}

// ---------- glue ----------

function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function escape(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function select(ref) {
  state.selected = ref;
  render();
}

function render() {
  renderList();
  renderDetail();
}

$("save").onclick = save;

$("search").oninput = (ev) => {
  state.query = ev.target.value;
  renderList();
};

$("filters").onclick = (ev) => {
  const chip = ev.target.closest(".chip");
  if (!chip) return;
  state.filter = chip.dataset.filter;
  for (const c of $("filters").children) c.setAttribute("aria-pressed", String(c === chip));
  renderList();
};

addEventListener("beforeunload", (ev) => {
  if (state.dirty) ev.preventDefault();
});

(async () => {
  const res = await fetch("/api/state");
  const body = await res.json();
  if (!res.ok) {
    $("status").textContent = body.error;
    return;
  }
  Object.assign(state, body);
  $("path").textContent = state.path;
  $("status").textContent = "clean";
  render();

  try {
    const catalog = await fetch("/api/catalog");
    if (catalog.ok) {
      state.catalog = await catalog.json();
      render();
    }
  } catch { /* the catalog is an enhancement, not a requirement */ }
})();
</script>
</body>
</html>
